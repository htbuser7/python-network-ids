[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-network-ids"
version = "0.1.0"
description = "A modular Python network intrusion detection system"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "scapy>=2.5.0",
]

[tool.setuptools.packages.find]
where = ["src"]
